
name: Go Website Monitor Tests

on:
  push:
    paths:
      - "projects/go-website-monitor/**"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "projects/go-website-monitor/**"
      - ".github/workflows/test.yml"

jobs:
  test:
    name: Run Go Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: projects/go-website-monitor

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: projects/go-website-monitor/go.sum

      - name: Run tests
        run: go test -race -v ./...

      - name: Run Go vet
        run: go vet ./...
